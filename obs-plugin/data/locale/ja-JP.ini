Status.WaitingUSB="USBでデバイスが検出されません。ケーブル（充電専用ではなくデータ通信対応のもの）を確認し、スマートフォンで「信頼」をタップしてください"
Status.WaitingUSB.Windows="USBでデバイスが検出されません。ケーブル（充電専用ではなくデータ通信対応のもの）を確認し、スマートフォンで「信頼」をタップして、iTunesがインストールされていることを確認してください。プラグインが接続するApple Mobile Device ServiceはiTunesに含まれています"
Status.WaitingUSB.Linux="USBでデバイスが検出されません。ケーブル（充電専用ではなくデータ通信対応のもの）を確認し、スマートフォンで「信頼」をタップして、usbmuxdデーモンがインストールされ実行中であることを確認してください（プラグインは/var/run/usbmuxdに接続します）"
Status.USBFound="デバイスは見つかりましたが、LensLinkアプリに接続できません。スマートフォンのロックを解除してアプリを開き（画面に表示されている必要があります）、アプリかここからカメラを開始するか、画面ブロードキャストを開始してください"
Status.Dialing="スマートフォンに接続を試行中："
Status.NoHost="スマートフォンのIPアドレスを入力してください（LensLinkアプリに表示されます）"
Status.DeviceBusy="このデバイスは別のLensLinkソースで使用中です。1台のスマートフォンが映像を送れるソースは一度に1つだけです"
Status.LookingForPhone="このソースのスマートフォンをネットワーク上で探しています…"
Status.WrongDevice="このソースの最後の既知のアドレスで別のLensLinkスマートフォンが応答しました。正しいスマートフォンを引き続き探しています"
Status.UnidentifiedDevice="スマートフォンが応答しましたが、このソースのスマートフォンであることを確認できませんでした。そのスマートフォンのLensLinkアプリをアップデートしてください"
Status.DecoderFailed="接続済みですが、このOBSビルドではストリームをデコードできません。アプリでH.264を試してください"
Status.CameraOnScreen="スマートフォンがカメラを送信中です。これはLensLink Screenソースです。スマートフォンで画面ブロードキャストを開始するか、LensLink Cameraソースを使ってください。"
Status.ScreenOnCamera="スマートフォンが画面ブロードキャストを送信中です。これはLensLink Cameraソースです。ブロードキャストにはLensLink Screenソースを使ってください。"
Status.WaitingPinned="選択したUSBデバイスの接続を待機中"
Status.GreenScreen=" · グリーンバック：オン"
Status.GreenScreen.NoFilter=" · グリーンバックはオンですが、このソースにはクロマキーフィルタがないため、緑が抜かれていません"
Status.Standby="接続済み：カメラはアイドル状態です。ここから開始できます（「スマートフォンのカメラを開始」を参照）。"
Status.StartingCamera="スマートフォンのカメラを起動中…"
HelpText="iPhone/iPadでLensLinkアプリを開きます。アプリの「OBSからリモート開始」オプションがオン（デフォルト）なら、開いておくだけで十分です。オフの場合は「開始」をタップします。次に、「接続」をWi-Fiにして上にスマートフォンのIPアドレス（アプリに表示されます）を入力するか、USBケーブルでスマートフォンを接続して「接続」をUSBに設定します（WindowsではiTunes、Linuxではusbmuxdデーモンが必要です）。"
HelpTextScreen="iPhone/iPadのLensLinkアプリで「画面をミラーリング」をタップし、LensLink Screenを選んで「ブロードキャストを開始」をタップします。Wi-Fi（上にスマートフォンのIPを入力）またはUSBケーブル（WindowsではiTunes、Linuxではusbmuxdデーモンが必要）で接続します。スマートフォンのシステム音声も一緒に送られます。DRMアプリ（Apple Music、Netflix）はブロードキャスト中、自動的にミュートされます。"

