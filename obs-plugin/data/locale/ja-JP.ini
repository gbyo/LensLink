DeactivateHidden="このソースがどこにも表示されていないときは切断"
DeactivateHidden.Desc="ソースが非表示（目のアイコンがオフ、または表示中のシーン、プレビュー、プロジェクターのどれにも含まれない）のときはスマートフォンとの接続を切断し、エンコードを停止させます。スマートフォンのバッテリーを節約でき、別のLensLinkソースでスマートフォンを使えるようになります。再び表示されると自動的に再接続します。自動開始がオンの場合は、非表示にするとスマートフォンのカメラも停止し、表示すると再び開始します。"
ScreenFps="フレームレート"
ScreenFps.60="60 fps"
ScreenFps.30="30 fps（Wi-Fiとバッテリーを節約）"
ScreenFps.Desc="スマートフォンが1秒間に送信するフレーム数です。30 fpsにすると、スマートフォンのエンコード負荷とWi-Fiの帯域幅がおよそ半分になります。スライド、書類、アプリには十分ですが、ゲームや動画では滑らかさが下がります。スマートフォンは引き続きフルレートでキャプチャし、エンコード前にフレームを間引きます。古いバージョンのアプリはこの設定を無視し、60 fpsのまま送信します。"
AutoStart="準備ができたらスマートフォンのカメラを自動で開始"
AutoStart.Desc="LensLinkアプリが開いていて待機中（アプリの「OBSからリモート開始」オプションがオン）のとき、このソースがカメラを自動で開始します。スマートフォンに触れる必要はありません。オフにすると、下のボタン、Webパネル、またはスマートフォンから手動で開始します。"
