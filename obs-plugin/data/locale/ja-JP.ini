Settings.MenuItem="LensLink設定"
Settings.Title="LensLink設定"
Settings.GpuPipeline="GPUデコードパイプライン（ベータ）"
Settings.GpuPipeline.Note="デコードした映像をシステムメモリ経由で受け渡さず、グラフィックカード上に保持します。CPU使用率と遅延が下がり、高解像度ほど効果が大きくなります。OBSの再起動後、すべてのLensLinkソースに適用されます。テクスチャを共有できないシステム（特殊なGPUやドライバの構成）では、ソースは自動的に標準のパイプラインに戻ります。"
Settings.Web="ブラウザコントロールパネル（カメラ操作と開始・停止。下のポートで提供）"
Settings.WebPort="パネルのポート"
Settings.Diagnostics="OBSログへの詳細な診断出力"
Settings.Dump="受信した映像をディスクに書き出す（トラブルシューティング用）"
Settings.Benchmark="パイプラインのベンチマークを記録（5秒ごとのログ行とCSVのサンプル）"
Settings.CopyDiagnostics="診断レポートをコピー"
Settings.CopyDiagnostics.Done="コピーしました。GitHubのissueに貼り付けてください。バージョン、ハードウェア、接続状態が含まれ、映像や個人データは含まれません。OBSのログにも出力されています。"
Settings.Benchmark.Tip="[lenslink][bench]の概要をOBSのログに出力し、1秒ごとに1件のサンプルをプラグインの設定フォルダ内のCSVに書き込みます（パスはログに出力されます）。各パイプラインで約10秒ずつ配信してからtools/bench-report.pyを実行すると、グラフ付きの統計的な比較レポートが得られます。"
