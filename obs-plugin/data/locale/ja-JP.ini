AutoCalibrate="自動キャリブレーション（スマートフォンのマイクを使用。アプリで「自動リップシンク用リファレンス」をオンにします。下の手動の遅延設定は無視されます）"
AutoVideoDelay="遅いマイク向けの映像自動遅延（ストリームより遅いマイクに合わせて映像を遅らせます）"
AudioLatency="オーディオデバイス自体の遅延（遅延から差し引かれます。手動モードのみ）"
